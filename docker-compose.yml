services:
  db:
    image: mysql:8.0
    container_name: caffeine-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localrootpw}
      MYSQL_DATABASE: caffeine_tracker
      MYSQL_USER: ${MYSQL_USER:-caffeine}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localpw}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"  # 로컬 전용. 약한 기본 비밀번호가 외부에 열리지 않도록 루프백에만 바인딩
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: caffeine-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/caffeine_tracker?serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-caffeine}
      DB_PASSWORD: ${MYSQL_PASSWORD:-localpw}
      # 기본값 없음: 레포에 공개된 키로 부팅되면 누구나 JWT를 위조할 수 있다. .env 에 설정(생성: openssl rand -base64 48)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다 (.env 참조)}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
