# 공통 설정(모든 프로파일 기본). 로컬 오버라이드: application-local.yaml(gitignore) · 운영: application-prod.yaml
spring:
  application:
    name: server

  # ---- 데이터소스 (DB_URL/DB_USERNAME/DB_PASSWORD 없으면 부팅 즉시 실패, 드라이버는 URL에서 자동 감지) ----
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # ---- JPA: 스키마는 Flyway가 관리하고 엔티티는 검증만(validate) ----
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ---- JWT (JWT_SECRET 은 32바이트 이상 필수) ----
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: caffeine-tracker
    expires-in-seconds: 3600            # 1시간
    refresh-expires-in-seconds: 1209600 # 14일

# ---- Swagger (prod 프로파일에서는 비활성) ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
    disable-swagger-default-url: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
