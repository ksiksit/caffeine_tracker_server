# 공통 설정(모든 프로파일 기본). 로컬 오버라이드: application-local.yaml(gitignore) · 운영: application-prod.yaml
spring:
  application:
    name: server

  # ---- 데이터소스 (DB_URL/DB_USERNAME/DB_PASSWORD 없으면 부팅 즉시 실패, 드라이버는 URL에서 자동 감지) ----
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # ---- JPA: 스키마는 앱이 만들지 않는다. docs/db-schema.sql 을 사용자가 직접 실행하고, 엔티티는 검증만(validate) ----
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  # ---- SQL 스크립트 초기화 끔: 스키마 적용은 사용자 몫 (테스트 프로파일만 docs/db-schema.sql 을 H2 에 적용) ----
  sql:
    init:
      mode: never

# ---- JWT (JWT_SECRET 은 32바이트 이상 필수) ----
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: caffeine-tracker
    expires-in-seconds: 3600            # 1시간
    refresh-expires-in-seconds: 1209600 # 14일
