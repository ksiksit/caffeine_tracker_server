# 운영 프로파일. docker-compose(.prod).yml 이 SPRING_PROFILES_ACTIVE=prod 로 활성화한다.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000 # ms

logging:
  level:
    root: INFO
    com.jongbeom.server: INFO
    org.hibernate.SQL: WARN

# 운영에서는 API 문서 미노출
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
