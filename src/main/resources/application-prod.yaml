# 운영 프로파일. docker-compose(.prod).yml 이 SPRING_PROFILES_ACTIVE=prod 로 활성화한다.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000 # ms

logging:
  level:
    root: INFO
    com.jongbeom.server: INFO
    org.hibernate.SQL: WARN
  structured:
    format:
      console: ecs # JSON 한 줄. MDC(requestId·userId)가 필드로 함께 나간다

management:
  # 8080 은 외부에 공개되므로 actuator 는 별도 포트로 분리한다. compose 는 8081 을 루프백에만 바인딩한다.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      # HTTP 지연 히스토그램 버킷. Grafana 의 p95 는 이 경계 사이를 보간한다.
      # 기본 히스토그램(수십 개 버킷) 대신 8개만 두어 엔드포인트 × 상태 코드별 시계열 수를 줄인다.
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
