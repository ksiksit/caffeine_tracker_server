# 로컬 모니터링: E2E 환경(docker-compose.e2e.yml 의 app·db)을 불러와 운영과 같은 설정의 Prometheus·Grafana 를 붙인다.
# 이 파일 하나로 여섯 컨테이너(app·db·prometheus·grafana·alertmanager·alert-sink)가 모두 뜬다:
#   docker compose -f docker-compose.monitoring.yml up --build -d
#     → API http://localhost:18080 · Grafana http://localhost:13000 (admin / local-grafana-pw) · Prometheus http://localhost:19090
#       Alertmanager http://localhost:19093 · 받은 경보: docker compose -f docker-compose.monitoring.yml logs -f alert-sink
#   docker compose -f docker-compose.monitoring.yml down   (볼륨이 없어 데이터는 남지 않는다)
# 설정 파일(monitoring/)과 이미지 태그는 docker-compose.prod.yml 과 같게 유지한다. 포트는 로컬 개발(3306·8080)·운영과 겹치지 않게 분리했다.
# 프로젝트 이름을 따로 두어 ./gradlew e2eTest 나 E2E 파일 단독 실행과 컨테이너가 섞이지 않게 한다.
name: caffeine-monitoring

include:
  - docker-compose.e2e.yml

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:19090:9090"

  # 로컬 경보 확인. 운영과 같은 route·억제 규칙(alertmanager.local.yml)으로 묶은 뒤 SNS 대신 alert-sink 로 보낸다.
  #   Alertmanager 화면 http://localhost:19093 · 받은 경보: docker compose -f docker-compose.monitoring.yml logs -f alert-sink
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.local.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address= # 한 대뿐이라 클러스터 통신을 끈다
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:19093:9093"

  alert-sink:
    image: python:3.12.8-alpine
    command: ["python", "-u", "/sink/local-sink.py"]
    volumes:
      - ./monitoring/alertmanager/local-sink.py:/sink/local-sink.py:ro

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-grafana-pw # 로컬 전용. 루프백에만 열리고 컨테이너를 내리면 사라진다
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
