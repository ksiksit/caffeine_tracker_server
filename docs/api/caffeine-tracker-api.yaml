                $ref: "#/components/schemas/CaffeineTodayResponse"
        "400":
          description: "잘못된 요청 형식 또는 입력값 검증 실패 (code: MALFORMED_JSON, VALIDATION_FAILED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 내부 오류 (code: INTERNAL_ERROR)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    UpdateSettingsRequest:
      type: object
      description: 설정 갱신 요청
      properties:
        halfLife:
          type: number
          format: double
          description: 슬라이더 반감기(h). 변경 시 학습 prior 리셋
          example: 5.0
          maximum: 7.0
          minimum: 3.0
        condition:
          type: integer
          format: int32
          description: 건강 상태 rawValue(0~3)
          example: 0
          maximum: 3
          minimum: 0
        bedtimeHour:
          type: integer
          format: int32
          description: 취침 시(0~23)
          example: 23
          maximum: 23
          minimum: 0
        bedtimeMinute:
          type: integer
          format: int32
          description: 취침 분(0~59)
          example: 0
          maximum: 59
          minimum: 0
        referenceDoseMg:
          type: integer
          format: int32
          description: 마감시각 기준 용량(mg)
          example: 75
          maximum: 1000
          minimum: 1
        isLearningEnabled:
          type: boolean
          description: 자동 학습 ON/OFF
          example: true
        learnedMean:
          type: number
          format: double
          description: "[선택] 학습값 시드 — 사후 평균(h)"
          example: 5.2
        learnedVariance:
          type: number
          format: double
          description: "[선택] 학습값 시드 — 사후 분산(h²)"
          example: 1.8
        lastLearnedDate:
          type: string
          format: date
          description: "[선택] 학습값 시드 — 마지막 학습 날짜"
      required:
      - bedtimeHour
      - bedtimeMinute
      - condition
      - halfLife
      - isLearningEnabled
      - referenceDoseMg
    SettingsResponse:
      type: object
      description: 유저 설정 + 학습 상태
      properties:
        halfLife:
          type: number
          format: double
          description: "슬라이더 반감기(h, base)"
          example: 5.0
        condition:
          type: integer
          format: int32
          description: "건강 상태 rawValue (0=없음,1=흡연,2=경구피임약,3=임신)"
          example: 0
        bedtimeHour:
          type: integer
          format: int32
          description: 취침 시(0~23)
          example: 23
        bedtimeMinute:
          type: integer
          format: int32
          description: 취침 분(0~59)
          example: 0
        referenceDoseMg:
          type: integer
          format: int32
          description: 마감시각 계산 기준 용량(mg)
          example: 75
        isLearningEnabled:
          type: boolean
          description: 자동 학습 ON/OFF
          example: true
        learnedMean:
          type: number
          format: double
          description: "학습된 사후 평균(h, base)"
          example: 5.0
        learnedVariance:
          type: number
          format: double
          description: 학습된 사후 분산(h²)
          example: 2.25
        lastLearnedDate:
          type: string
          format: date
          description: 마지막 학습 날짜(없으면 null)
          example: 2026-05-30
        inferredBaseHalfLife:
          type: number
          format: double
          description: "[파생] 학습/슬라이더로 결정된 base 반감기(h)"
          example: 5.0
        effectiveHalfLifeHours:
          type: number
          format: double
          description: "[파생] condition 적용된 실제 반감기(h)"
          example: 5.0
    UpdateCaffeineRecordRequest:
      type: object
      description: 카페인 기록 수정 요청
      properties:
        amount:
          type: integer
          format: int32
          description: 카페인 함량(mg)
          example: 150
          maximum: 10000
          minimum: 1
        drinkName:
          type: string
          description: 음료명
          example: 아메리카노
          maxLength: 100
          minLength: 0
        timestamp:
          type: string
          format: date-time
          description: 섭취 시각(ISO-8601 + 오프셋)
          example: 2026-06-01T14:30:00+09:00
      required:
      - amount
      - timestamp
    CaffeineRecordResponse:
      type: object
      description: 카페인 기록
      properties:
        id:
          type: integer
          format: int64
          description: 기록 ID
          example: 1
        amount:
          type: integer
          format: int32
          description: 카페인 함량(mg)
          example: 150
        drinkName:
          type: string
          description: 음료명
          example: 아메리카노
        timestamp:
          type: string
          format: date-time
          description: 섭취 시각(UTC)
          example: 2026-06-01T05:30:00Z
    SampleItem:
      type: object
      description: 수면 샘플 한 건
      properties:
        clientUuid:
          type: string
          description: 클라이언트 생성 멱등 키
          example: B1F1...
          maxLength: 64
          minLength: 0
        start:
          type: string
          format: date-time
          description: 시작 시각(ISO-8601+오프셋)
          example: 2026-05-31T23:10:00+09:00
        end:
          type: string
          format: date-time
          description: 종료 시각(ISO-8601+오프셋)
          example: 2026-05-31T23:40:00+09:00
        hkValue:
          type: integer
          format: int32
          description: "HK rawValue(0=inBed,1=unspecified,2=awake,3=core,4=deep,5=rem)"
          example: 3
          maximum: 5
          minimum: 0
      required:
      - end
      - hkValue
      - start
    UploadSleepSamplesRequest:
      type: object
      description: "HealthKit 원시 수면 샘플 업로드(배치, client_uuid 멱등)"
      properties:
        samples:
          type: array
          description: 수면 샘플 목록
          items:
            $ref: "#/components/schemas/SampleItem"
          minItems: 1
    UploadSleepSamplesResponse:
      type: object
      description: 수면 샘플 업로드 결과
      properties:
        received:
          type: integer
          format: int32
          description: 수신한 샘플 수
          example: 120
        inserted:
          type: integer
          format: int32
          description: 새로 저장된 샘플 수(멱등 중복 제외)
          example: 118
    LearningRunResponse:
      type: object
      description: 학습 실행 결과
      properties:
        updatedCount:
          type: integer
          format: int32
          description: 이번에 새로 학습된 관측 수
          example: 1
        skipReason:
          type: string
          description: 건너뛴 사유 코드(없으면 null)
          example: ALREADY_LEARNED
        skipMessage:
          type: string
          description: 건너뛴 사유 메시지(없으면 null)
    CreateCaffeineRecordRequest:
      type: object
      description: 카페인 기록 생성 요청
      properties:
        amount:
          type: integer
          format: int32
          description: 카페인 함량(mg)
          example: 150
          maximum: 10000
          minimum: 1
        drinkName:
          type: string
          description: 음료명
          example: 아메리카노
          maxLength: 100
          minLength: 0
        timestamp:
          type: string
          format: date-time
          description: 섭취 시각(ISO-8601 + 오프셋)
          example: 2026-06-01T14:30:00+09:00
      required:
      - amount
      - timestamp
    SignupRequest:
      type: object
      description: 회원가입 요청
      properties:
        email:
          type: string
          description: 가입할 이메일 주소
          example: user@example.com
          maxLength: 255
          minLength: 0
        password:
          type: string
          format: password
          description: 비밀번호 (8~72자)
          example: P@ssw0rd123
          maxLength: 72
          minLength: 8
        nickname:
          type: string
          description: 닉네임 (2~20자)
          example: 카페인러버
          maxLength: 20
          minLength: 2
    ErrorResponse:
      type: object
      description: 에러 응답 공통 포맷
      properties:
        code:
          type: string
          description: "에러 코드 (EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN,\
            \ VALIDATION_FAILED, MALFORMED_JSON, INTERNAL_ERROR 중 하나)"
          example: INVALID_CREDENTIALS
        message:
          type: string
          description: 사람이 읽을 수 있는 에러 메시지
          example: 이메일 또는 비밀번호가 올바르지 않습니다.
        fieldErrors:
          type: array
          description: 필드별 검증 오류 목록 (VALIDATION_FAILED 일 때만 채워짐)
          items:
            $ref: "#/components/schemas/FieldError"
        timestamp:
          type: string
          format: date-time
          description: 에러 발생 시각 (ISO-8601 with offset)
          example: 2026-05-02T10:30:00+09:00
    FieldError:
      type: object
      description: 필드별 검증 오류
      properties:
        field:
          type: string
          description: 오류 발생 필드명
          example: password
        message:
          type: string
          description: 필드별 오류 메시지
          example: 8자 이상 입력해주세요
    SignupResponse:
      type: object
      description: 회원가입 응답
      properties:
        userId:
          type: integer
          format: int64
          description: 생성된 사용자 ID
          example: 1
        email:
          type: string
          description: 사용자 이메일
          example: user@example.com
        nickname:
          type: string
          description: 사용자 닉네임
          example: 카페인러버
    RefreshTokenRequest:
      type: object
      description: 토큰 갱신 요청
      properties:
        refreshToken:
          type: string
          description: 발급받은 Refresh Token
          example: eyJhbGciOiJIUzI1NiJ9...
          minLength: 1
    TokenResponse:
      type: object
      description: 토큰 발급 응답
      properties:
        accessToken:
          type: string
          description: "Access Token (JWT). 인증이 필요한 요청에 `Authorization: Bearer {accessToken}`\
            \ 헤더로 전달."
          example: eyJhbGciOiJIUzI1NiJ9...
        refreshToken:
          type: string
          description: Refresh Token. Access Token 만료 시 /api/auth/refresh 호출에 사용.
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          description: 토큰 타입 (항상 "Bearer")
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access Token 유효 시간 (초)
          example: 3600
        refreshExpiresIn:
          type: integer
          format: int64
          description: Refresh Token 유효 시간 (초)
          example: 1209600
    LogoutRequest:
      type: object
      description: 로그아웃 요청
      properties:
        refreshToken:
          type: string
          description: 현재 보유한 Refresh Token
          example: eyJhbGciOiJIUzI1NiJ9...
          minLength: 1
    LoginRequest:
      type: object
      description: 로그인 요청
      properties:
        email:
          type: string
          description: 이메일
          example: user@example.com
          minLength: 1
        password:
          type: string
          format: password
          description: 비밀번호
          example: P@ssw0rd123
          minLength: 1
    RecordItem:
      type: object
      description: 수면 구간
      properties:
        start:
          type: string
          format: date-time
          description: 시작(UTC)
        end:
          type: string
          format: date-time
          description: 종료(UTC)
        hkValue:
          type: integer
          format: int32
          description: HK rawValue
    SleepSummaryResponse:
      type: object
      description: 수면 요약(서버 병합·계산)
      properties:
        date:
          type: string
          format: date
          description: 대상 날짜(아침 기준)
        hasData:
          type: boolean
          description: 수면 데이터 존재 여부
        bedtimeStart:
          type: string
          format: date-time
          description: "취침 시작(최초 inBed, UTC, 없으면 null)"
        records:
          type: array
          description: 병합된 수면 구간
          items:
            $ref: "#/components/schemas/RecordItem"
        totalSleepSeconds:
          type: number
          format: double
          description: 총 수면 시간(초)
        timeInBedSeconds:
          type: number
          format: double
          description: 침대 시간(초)
        sleepEfficiency:
          type: number
          format: double
          description: 수면 효율(0~1)
        sleepOnsetLatencySeconds:
          type: number
          format: double
          description: "수면 잠복기(초, 없으면 null)"
        stageBreakdown:
          type: array
          description: 단계별 시간
          items:
            $ref: "#/components/schemas/StageItem"
    StageItem:
      type: object
      description: 단계별 시간
      properties:
        hkValue:
          type: integer
          format: int32
          description: HK rawValue
        durationSeconds:
          type: number
          format: double
          description: 시간(초)
    MeResponse:
      type: object
      description: 현재 사용자 정보
      properties:
        userId:
          type: integer
          format: int64
          description: 사용자 ID
          example: 1
        email:
          type: string
          description: 사용자 이메일
          example: user@example.com
    ObservationResponse:
      type: object
      description: 베이지안 학습 관측 1건
      properties:
        date:
          type: string
          format: date
          description: 관측 날짜(아침 기준)
        predictedResidualAtBedtime:
          type: number
          format: double
          description: 취침 시 예상 카페인 잔량(mg)
        observedSolMinutes:
          type: number
          format: double
          description: 측정된 수면 잠복기(분)
        priorMean:
          type: number
          format: double
          description: 갱신 전 prior 평균(h)
        posteriorMean:
          type: number
          format: double
          description: 갱신 후 posterior 평균(h)
        posteriorVariance:
          type: number
          format: double
          description: 갱신 후 posterior 분산(h²)
        conditionMultiplier:
          type: number
          format: double
          description: 건강상태 multiplier
    Calibration:
      type: object
      description: "calibration: 예측 SOL vs 관측 SOL"
      properties:
        points:
          type: array
          description: 산점도 점
          items:
            $ref: "#/components/schemas/PointItem"
        rSquared:
          type: number
          format: double
          description: R²(N<3 또는 분산0이면 null)
        rmse:
          type: number
          format: double
          description: RMSE(분)
        domainLower:
          type: number
          format: double
          description: 축 도메인 하한
        domainUpper:
          type: number
          format: double
          description: 축 도메인 상한
    HistogramBinItem:
      type: object
      properties:
        lower:
          type: number
          format: double
        upper:
          type: number
          format: double
        count:
          type: integer
          format: int32
    LatestEstimate:
      type: object
      description: 최신 추정
      properties:
        posteriorMean:
          type: number
          format: double
          description: 사후 평균(h)
        posteriorVariance:
          type: number
          format: double
          description: 사후 분산(h²)
        ciLower:
          type: number
          format: double
          description: 95% CI 하한(h)
        ciUpper:
          type: number
          format: double
          description: 95% CI 상한(h)
        confidence:
          type: number
          format: double
          description: 신뢰도(0~1)
    LearningDashboardResponse:
      type: object
      description: 학습 대시보드(서버 계산)
      properties:
        count:
          type: integer
          format: int32
          description: 관측 수
        latest:
          $ref: "#/components/schemas/LatestEstimate"
          description: 최신 추정(count=0이면 null)
        observations:
          type: array
          description: 관측 이력(날짜 오름차순)
          items:
            $ref: "#/components/schemas/ObservationResponse"
        calibration:
          $ref: "#/components/schemas/Calibration"
          description: 모델 정확도(calibration)
        residualHistogram:
          type: array
          description: 취침 잔량 히스토그램
          items:
            $ref: "#/components/schemas/HistogramBinItem"
        solHistogram:
          type: array
          description: 측정 SOL 히스토그램
          items:
            $ref: "#/components/schemas/HistogramBinItem"
    PointItem:
      type: object
      properties:
        predicted:
          type: number
          format: double
        observed:
          type: number
          format: double
    CaffeineTodayResponse:
      type: object
      description: 오늘의 카페인 현황(서버 계산)
      properties:
        now:
          type: string
          format: date-time
          description: "계산 기준 시각(에코, UTC)"
        bedtime:
          type: string
          format: date-time
          description: 다음 취침 시각(UTC)
        records:
          type: array
          description: 오늘 기록(차트 시작 5시 이후)
          items:
            $ref: "#/components/schemas/CaffeineRecordResponse"
        todayTotal:
          type: integer
          format: int32
          description: 오늘 총 섭취량(mg)
          example: 300
        overDailyLimit:
          type: boolean
          description: 일일 권장량(400mg) 초과 여부
        chart:
          type: array
          description: 15분 간격 잔류량 시계열
          items:
            $ref: "#/components/schemas/DataPointResponse"
        currentResidual:
          type: number
          format: double
          description: 현재 잔류량(mg)
          example: 120.5
        predictedAtBedtime:
          type: number
          format: double
          description: 취침 시 예상 잔류량(mg)
          example: 20.3
        cutoff:
          $ref: "#/components/schemas/CutoffResponse"
          description: 마감시각 계산 결과
        effectiveHalfLifeHours:
          type: number
          format: double
          description: 계산에 사용된 실제 반감기(h)
          example: 5.0
        referenceDoseMg:
          type: integer
          format: int32
          description: 마감시각 기준 용량(mg)
          example: 75
    CutoffResponse:
      type: object
      description: "마감시각 결과. status: SAFE_ANYTIME(언제나 가능) / CUTOFF(cutoff 까지) / ALREADY_EXCEEDED(이\
        미 초과)"
      properties:
        status:
          type: string
          description: SAFE_ANYTIME | CUTOFF | ALREADY_EXCEEDED
        cutoff:
          type: string
          format: date-time
          description: "마감 시각(status=CUTOFF 일 때, UTC)"
        existingAtBedtime:
          type: number
          format: double
          description: "취침 시 잔량(status=ALREADY_EXCEEDED 일 때, mg)"
    DataPointResponse:
      type: object
      description: 잔류량 시계열 점
      properties:
        time:
          type: string
          format: date-time
          description: 시각(UTC)
        concentrationMg:
          type: number
          format: double
          description: 잔류량(mg)
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT Access Token
      scheme: bearer
      bearerFormat: JWT
