services:
  app:
    image: ghcr.io/ksiksit/caffeine_tracker_server:latest
    container_name: caffeine-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081" # actuator(헬스·메트릭). 외부에 열리지 않도록 루프백에만 바인딩
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # 메트릭 저장소. 앱의 app:8081/actuator/prometheus 를 15초마다 긁어 시계열로 쌓는다.
  # 보관은 15일 또는 2GB 중 먼저 닿는 쪽까지. 설정 파일은 compose 와 같은 폴더의 monitoring/ 에서 읽는다.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: caffeine-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro # 경보 규칙. prometheus.yml 이 같은 폴더에서 읽는다
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # 인증이 없으므로 루프백에만. PC 에서는 SSH 터널로 본다
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 경보 전달. Prometheus 가 평가한 경보를 묶고·억제해 SNS(VPC 엔드포인트)로 보낸다. 설계: docs/alerting-plan.md
  # AWS 준비(SNS 토픽·엔드포인트·인스턴스 역할) 전에는 띄우지 않는다 — alerting 프로필을 줄 때만 뜬다:
  #   docker compose -f docker-compose.prod.yml --profile alerting up -d
  # .env 의 토픽 ARN 이 비면 이 컨테이너만 시작을 거부한다(entrypoint.sh). 앱 기동은 막지 않으려고 :? 필수 변수를 쓰지 않는다.
  alertmanager:
    image: prom/alertmanager:v0.28.1 # monitoring/check.sh 의 검사 이미지와 같은 태그
    container_name: caffeine-alertmanager
    profiles: ["alerting"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERT_TOPIC_ARN: ${ALERT_TOPIC_ARN:-}
      HEARTBEAT_TOPIC_ARN: ${HEARTBEAT_TOPIC_ARN:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager # 사일런스·알림 기록. 재시작해도 배포 사일런스가 유지된다
    ports:
      - "127.0.0.1:9093:9093" # 인증이 없으므로 루프백에만. PC 에서는 SSH 터널로 본다
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 대시보드. 데이터소스와 대시보드는 monitoring/grafana 에서 자동 등록된다.
  grafana:
    image: grafana/grafana:12.1.0
    container_name: caffeine-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env 에 GRAFANA_ADMIN_PASSWORD 가 필요하다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # EC2 는 외부 인터넷이 없다 — 업데이트 확인·사용 통계 전송·뉴스 피드를 끈다
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000" # 루프백에만. PC 에서는 SSH 터널로 본다
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
